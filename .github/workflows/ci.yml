name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# The suite fakes the browser (injectable browserFactory); the one gated
# real-Chromium file skips honestly when no browser resolves. Skipping the
# ~700 MB Puppeteer download keeps CI fast until the vendor-boundary plan
# makes the pinned browser a proper fetched pack.
env:
  PUPPETEER_SKIP_DOWNLOAD: '1'

jobs:
  linux:
    name: Linux (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: engine/package-lock.json

      # apt-get on ubuntu-latest can hang on the runner's apt lock (observed:
      # 28+ minutes in run #1). The static build needs no locks and no sudo.
      - name: Install FFmpeg (static build)
        working-directory: .
        run: |
          curl -fsSL https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz | tar -xJ -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP"/ffmpeg-*-static >> "$GITHUB_PATH"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Doctor
        run: npm run doctor

      - name: Test
        run: npm test

  windows:
    name: Windows (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: engine/package-lock.json

      - name: Install FFmpeg
        run: choco install ffmpeg -y --no-progress
        working-directory: .

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Doctor
        run: npm run doctor

      - name: Test
        run: npm test
