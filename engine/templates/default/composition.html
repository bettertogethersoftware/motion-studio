<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>__SCENE_NAME__</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!--
    Motion Studio composition entry point.
    Stage size is fixed by scene.json (__WIDTH__x__HEIGHT__ @ __FPS__fps,
    __DURATION__ frames). The render engine loads this file in headless
    Chromium, calls window.setFrame(n) per frame, waits for
    window.frameReady, then screenshots.

    Load order matters: frame-api.js must load before composition.js.
  -->
  <div id="stage">
    <div id="title" class="layer">__SCENE_NAME__</div>
    <div id="subtitle" class="layer">rendered frame by frame</div>
  </div>

  <script src="frame-api.js"></script>
  <script src="composition.js"></script>
</body>
</html>
